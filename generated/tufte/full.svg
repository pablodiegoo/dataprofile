  <text x="18" y="137" class="body-txt">Economist graduated from the Federal University of Rio de Janeiro (UFRJ) and Wealth &amp;</text>
  <text x="18" y="161" class="body-txt">Investment Advisor accredited by ANCORD under CVM Resolution 178. As a partner at Meta</text>
  <text x="18" y="185" class="body-txt">Investimentos, he works on asset allocation, quantitative risk modeling, and regulatory</text>
  <text x="18" y="209" class="body-txt">compliance, serving clients nationwide with a regional presence in Região dos Lagos/RJ</text>
  <text x="18" y="233" class="body-txt">(Araruama and Rio das Ostras).</text>
  <text x="18" y="269" class="body-txt">He holds an MBA in Data Science and Analytics from USP/ESALQ and is a Master&#39;s candidate</text>
  <text x="18" y="293" class="body-txt">in Production Engineering and Computational Systems at Fluminense Federal University</text>
  <text x="18" y="317" class="body-txt">(UFF/MESC), where he researches Operations Research and Combinatorial Optimization applied</text>
  <text x="18" y="341" class="body-txt">to statistical arbitrage and portfolio selection on B3.</text>
  <text x="18" y="377" class="body-txt">His prior background spans qualitative and quantitative market research, public opinion</text>
  <text x="18" y="401" class="body-txt">analysis, and analytics engineering, including the technical design of the FieldCopilot</text>
  <text x="18" y="425" class="body-txt">platform.</text>
